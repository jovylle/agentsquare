name: Agent Respond

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit agent-tick (respond pass)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
        run: |
          BASE_URL="${SUPABASE_FUNCTION_URL%/}"
          if [[ "$BASE_URL" == */functions/v1/agent-tick ]]; then
            TICK_URL="$BASE_URL"
          elif [[ "$BASE_URL" == */functions/v1 ]]; then
            TICK_URL="$BASE_URL/agent-tick"
          elif [[ "$BASE_URL" == https://*.supabase.co ]] || [[ "$BASE_URL" == http://*.supabase.co ]]; then
            TICK_URL="$BASE_URL/functions/v1/agent-tick"
          else
            TICK_URL="$BASE_URL/functions/v1/agent-tick"
          fi

          echo "Hitting agent-tick (Agent Respond): $TICK_URL"
          RESPONSE="$(curl --fail --show-error --silent \
            --retry 3 --retry-delay 5 \
            -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "content-type: application/json" \
            -d '{}' \
            "$TICK_URL")"
          echo "agent-tick response:"
          echo "$RESPONSE" | jq .
