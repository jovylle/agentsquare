name: Agent initiator

on:
  schedule:
    # Minute 0 of each 5-min block (UTC). Staggered vs respond/follow-up to avoid 3 long jobs at once.
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-initiator
  cancel-in-progress: false

jobs:
  initiator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hit agent-initiator endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
        run: |
          BASE_URL="${SUPABASE_FUNCTION_URL%/}"
          # Only treat .../functions/v1/agent-* as complete; bare .../agent-initiator is not a valid Supabase path (404).
          if [[ "$BASE_URL" == */functions/v1/agent-initiator ]]; then
            INIT_URL="$BASE_URL"
          elif [[ "$BASE_URL" == */functions/v1/agent-tick ]]; then
            INIT_URL="${BASE_URL%/agent-tick}/agent-initiator"
          elif [[ "$BASE_URL" == */functions/v1 ]]; then
            INIT_URL="$BASE_URL/agent-initiator"
          elif [[ "$BASE_URL" == https://*.supabase.co ]] || [[ "$BASE_URL" == http://*.supabase.co ]]; then
            INIT_URL="$BASE_URL/functions/v1/agent-initiator"
          else
            INIT_URL="$BASE_URL/functions/v1/agent-initiator"
          fi

          echo "Hitting agent-initiator endpoint: $INIT_URL"
          PASSES="${AGENT_TICK_PASSES:-2}"
          INTERVAL_SEC="${AGENT_TICK_INTERVAL_SEC:-90}"
          for pass in $(seq 1 "$PASSES"); do
            echo "Pass ${pass}/${PASSES}"
            curl --fail --show-error --silent \
              --retry 3 --retry-delay 5 \
              -X POST \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -H "content-type: application/json" \
              -d '{}' \
              "$INIT_URL"
            if [ "$pass" -lt "$PASSES" ]; then
              echo "Sleeping ${INTERVAL_SEC}s before next pass…"
              sleep "$INTERVAL_SEC"
            fi
          done
