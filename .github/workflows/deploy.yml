name: Deploy

# Runs on every push to master: deploys the web app to Cloudflare Workers and, when files under
# supabase/ changed, applies migrations and deploys Edge Functions to Supabase.
# Repo secrets needed: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_ACCESS_TOKEN.
# Public build values live in .env.production. The webhook secret is NOT managed here (see OPERATIONS.md).

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: rgobmzgblfvpbhfeeezl

jobs:
  web:
    # Database and functions first: new app code may select columns a migration adds.
    needs: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler needs Node 22+
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build and deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Did supabase/ change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -q '^supabase/'; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.yes == 'true'
        with:
          version: latest
      - name: Apply migrations
        if: steps.changed.outputs.yes == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy Edge Functions
        if: steps.changed.outputs.yes == 'true'
        run: supabase functions deploy --use-api --yes --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
